services:
  - type: web
    name: bahoniq-work-center
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BAHONIQ_PASSWORD
        sync: false
