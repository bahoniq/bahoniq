name: Keep Render Awake 24/7
on:
  schedule:
    # Запуск каждые 10 минут, чтобы Render Free Tier никогда не уходил в сон (Spin down)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BahonIQ
        run: |
          curl -s -f --max-time 30 https://bahoniq.onrender.com/health || echo "Waking up..."
